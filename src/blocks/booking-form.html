<style>
    .booking-card {
        background: white;
        padding: 3.5rem;
        border-radius: 8px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        border: 1px solid #f0f0f0;
        transition: transform 0.3s ease;
    }

    .grid-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
    }

    .form-group label {
        display: block;
        font-weight: 700;
        margin-bottom: 0.6rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #666;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        font-size: 0.95rem;
        background: #fafafa;
        transition: all 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: var(--accent);
        background: white;
        outline: none;
        box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.1);
    }

    /* Mobile Responsive Logic */
    @media (max-width: 768px) {
        .booking-card {
            padding: 2rem 1.5rem;
            margin: 0 10px;
        }

        .grid-form {
            grid-template-columns: 1fr;
            gap: 1.2rem;
        }

        .form-group.full-width-mobile {
            grid-column: span 1 !important;
        }

        .booking-header h2 {
            font-size: 1.6rem !important;
        }
    }
</style>

<section class="booking-section" style="padding: 5rem 0; background: #fcfcfc;">
    <div class="container" style="max-width: 850px;">
        <div class="booking-card">
            <div class="booking-header"
                style="margin-bottom: 2.5rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 2rem; text-align: center;">
                <h2 style="font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--primary); font-weight: 900;">{{
                    site.booking.title }}</h2>
                <p style="color: var(--secondary); max-width: 500px; margin: 0 auto;">{{ site.booking.emphasis }}</p>
                <div class="capacity-alert"
                    style="margin: 1.5rem auto 0; font-size: 0.85rem; padding: 1rem; background: #fffcf0; border-radius: 6px; border-left: 4px solid #f39c12; color: #8a6d3b; text-align: left; max-width: 600px;">
                    <strong
                        style="display: block; margin-bottom: 0.2rem; text-transform: uppercase; font-size: 0.7rem;">Sanctuary
                        Policy</strong>
                    {{ site.booking.capacity.max_per_hour }} people per hour limit. Interval: {{
                    site.booking.capacity.interval_minutes }} min sequences.
                </div>
            </div>

            <form id="bookingForm" class="grid-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Who's joining us?" required>
                </div>
                <div class="form-group">
                    <label>Group Size</label>
                    <select name="group_size" required>
                        {% for i in range(1, 9) %}<option value="{{ i }}">{{ i }} People</option>{% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="bookingDate" name="date" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <select id="bookingTime" name="time" required>
                        <option value="">Select Date First</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="For the confirmation invite" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Mobile Number</label>
                    <input type="tel" name="mobile" placeholder="To reach you in the lane" required>
                </div>

                <div style="grid-column: span 2; margin-top: 1rem;">
                    <button type="submit" class="btn"
                        style="width: 100%; cursor: pointer; border: none; padding: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;">Request
                        Table Reservation</button>
                    <p
                        style="font-size: 0.75rem; color: var(--secondary); margin-top: 1.2rem; text-align: center; opacity: 0.7;">
                        By booking, you agree to our terms: {{ site.booking.terms | join(', ') }}
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const openingHours = {{ site.operations.opening_hours | dump | safe
    }};
    const interval = {{ site.booking.capacity.interval_minutes }};
    const dateInput = document.getElementById('bookingDate');
    const timeSelect = document.getElementById('bookingTime');

    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    dateInput.addEventListener('change', function (e) {
        const selectedDate = new Date(e.target.value);
        const dayName = selectedDate.toLocaleDateString('en-US', { weekday: 'long' });

        const match = openingHours.find(h => {
            if (h.days.includes('-')) {
                return dayName !== 'Saturday' && dayName !== 'Sunday';
            }
            return h.days.includes(dayName);
        });

        timeSelect.innerHTML = '';

        if (match) {
            let current = parseTime(match.open);
            const end = parseTime(match.close);

            while (current < end) {
                const timeStr = formatTime(current);
                const opt = document.createElement('option');
                opt.value = timeStr;
                opt.textContent = timeStr;
                timeSelect.appendChild(opt);
                current.setMinutes(current.getMinutes() + interval);
            }
        } else {
            const opt = document.createElement('option');
            opt.textContent = "Closed on this day";
            timeSelect.appendChild(opt);
        }
    });

    function parseTime(t) {
        const [h, m] = t.split(':').map(Number);
        const d = new Date();
        d.setHours(h, m, 0, 0);
        return d;
    }

    function formatTime(d) {
        return d.getHours().toString().padStart(2, '0') + ':' +
            d.getMinutes().toString().padStart(2, '0');
    }

    const form = document.getElementById('bookingForm');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const originalBtnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                form.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <div style="font-size: 4rem; margin-bottom: 1.5rem;">✨</div>
                            <h3 style="color: var(--primary); font-size: 1.8rem;">Booking Received!</h3>
                            <p style="color: var(--secondary); margin-bottom: 2rem; line-height: 1.6;">Cheers, ${payload.name}! We've received your request for ${payload.date} at ${payload.time}. We'll confirm your spot in the lane via email shortly.</p>
                            <button onclick="window.location.reload()" class="btn" style="padding: 1rem 2rem;">Make Another Booking</button>
                        </div>
                    `;
            } else {
                throw new Error(result.error || 'Failed to send request');
            }
        } catch (error) {
            console.error('Booking Error:', error);
            alert('Sorry mate, there was a snag: ' + error.message + '. Try calling us at {{ site.contact.nap.phone }}.');
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
        }
    });
    });
</script>
