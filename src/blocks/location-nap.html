<section class="location-nap" style="padding: 4rem 0; background: var(--bg);">
    <div class="container">
        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4rem; align-items: center;">
            <div class="info">
                <h2 style="margin-top: 0;">Find Us</h2>
                <p style="font-size: 1.25rem; margin-bottom: 0.5rem;">{{ site.contact.nap.address }}</p>
                <p style="color: var(--accent); font-weight: bold; margin-bottom: 1.5rem;">
                    {{ site.contact.nap.directions }}
                </p>
                <div style="margin: 2rem 0;">
                    <p><strong>Phone:</strong> <a href="tel:{{ site.contact.nap.phone }}"
                            style="color: inherit; text-decoration: none;">{{ site.contact.nap.phone }}</a></p>
                    <p><strong>Email:</strong> <a href="mailto:{{ site.contact.nap.email }}"
                            style="color: inherit; text-decoration: none;">{{ site.contact.nap.email }}</a></p>
                </div>
                <div class="social-links" style="margin-top: 1rem;">
                    <a href="{{ site.contact.social.instagram }}"
                        style="margin-right: 1rem; color: var(--accent);">Instagram</a>
                    <a href="{{ site.contact.social.facebook }}" style="color: var(--accent);">Facebook</a>
                </div>
            </div>
            <div class="map-placeholder"
                style="background: #ddd; height: 400px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666;">
                <div style="text-align: center;">
                    <p><strong>Google Maps Data</strong></p>
                    <p>Lat: {{ site.contact.nap.geo.latitude }} / Lng: {{ site.contact.nap.geo.longitude }}</p>
                    <p><a href="{{ site.contact.same_as[0] }}" target="_blank" style="color: var(--accent);">View on
                            Search</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
