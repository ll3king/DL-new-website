<!-- Admin Dashboard Block -->
<section class="admin-dashboard" style="padding: 4rem 0; min-height: 80vh; background: #f4f6f8;">
    <div class="container">
        <div class="admin-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <div>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">{{ site.admin.dashboard_title }}</h1>
                <p style="color: var(--secondary);">Manage your lane sanctuary's reservations and capacity limits.</p>
            </div>
            <div class="view-toggles"
                style="display: flex; gap: 0.5rem; background: white; padding: 0.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <button id="view-list-btn" class="active btn-small"
                    style="padding: 0.5rem 1rem; cursor: pointer; border: none; background: var(--accent); color: white; border-radius: 4px;">List
                    View</button>
                <button id="view-cal-btn" class="btn-small"
                    style="padding: 0.5rem 1rem; cursor: pointer; border: none; background: transparent; color: var(--primary); border-radius: 4px;">Calendar
                    View</button>
            </div>
        </div>

        <!-- Dashboard Content Container -->
        <div id="dashboard-content"
            style="background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); padding: 2rem; overflow: hidden; border: 1px solid #eee;">
            <!-- List View -->
            <div id="list-view">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f8f9fa;">
                        <tr>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Status</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Guest</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Date/Time</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Size</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-list-body">
                        <!-- Dynamic Loading -->
                    </tbody>
                </table>
            </div>

            <!-- Calendar View (Simplified placeholder) -->
            <div id="calendar-view" style="display: none;">
                <div
                    style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #eee; border: 1px solid #eee;">
                    <!-- Calendar Grid Header -->
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        MON</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        TUE</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        WED</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        THU</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        FRI</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        SAT</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.8rem;">
                        SUN</div>

                    <!-- Days -->
                    <div id="calendar-days-grid" style="display: contents;"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const listView = document.getElementById('list-view');
        const calView = document.getElementById('calendar-view');
        const listBtn = document.getElementById('view-list-btn');
        const calBtn = document.getElementById('view-cal-btn');

        // Mock Data for Table Management
        const mockBookings = [
            { id: '1', name: 'James Hobart', email: 'james@example.com', date: '2026-02-28', time: '10:15', size: 4, status: 'Confirmed', source: 'web' },
            { id: '2', name: 'Lily Chen', email: 'lily@domain.au', date: '2026-03-01', time: '09:30', size: 8, status: 'Manual_Review', source: 'chatbot' },
            { id: '3', name: 'Tom Walker', email: 'tom.w@hobart.local', date: '2026-03-05', time: '12:00', size: 2, status: 'Confirmed', source: 'web' },
            { id: '4', name: 'Anna Green', email: 'anna@green.com', date: '2026-03-05', time: '12:30', size: 10, status: 'Manual_Review', source: 'chatbot' }
        ];

        // Toggle Views
        listBtn.addEventListener('click', () => {
            listView.style.display = 'block';
            calView.style.display = 'none';
            listBtn.style.background = 'var(--accent)';
            listBtn.style.color = 'white';
            calBtn.style.background = 'transparent';
            calBtn.style.color = 'var(--primary)';
        });

        calBtn.addEventListener('click', () => {
            listView.style.display = 'none';
            calView.style.display = 'block';
            calBtn.style.background = 'var(--accent)';
            calBtn.style.color = 'white';
            listBtn.style.background = 'transparent';
            listBtn.style.color = 'var(--primary)';
            renderCalendar();
        });

        function renderList() {
            const body = document.getElementById('bookings-list-body');
            body.innerHTML = mockBookings.map(b => `
            <tr style="border-bottom: 1px solid #f0f0f0;">
                <td style="padding: 1.2rem;">
                    <span style="padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; ${getStatusStyle(b.status)}">
                        ${b.status.replace('_', ' ')}
                    </span>
                </td>
                <td style="padding: 1.2rem;">
                    <strong>${b.name}</strong><br>
                    <span style="font-size: 0.8rem; color: #7f8c8d;">${b.email}</span>
                </td>
                <td style="padding: 1.2rem;">
                    ${b.date}<br>
                    <span style="font-size: 0.8rem; font-weight: 600;">${b.time}</span>
                </td>
                <td style="padding: 1.2rem;">${b.size} People</td>
                <td style="padding: 1.2rem;">
                    <button style="background: #34495e; color: white; border: none; padding: 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer;">Manage</button>
                    ${b.status === 'Manual_Review' ? `<button style="background: #27ae60; color: white; border: none; padding: 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer; margin-left: 0.2rem;">Approve</button>` : ''}
                </td>
            </tr>
        `).join('');
        }

        function getStatusStyle(status) {
            if (status === 'Confirmed') return 'background: #e6f7ee; color: #27ae60;';
            if (status === 'Manual_Review') return 'background: #fff8e1; color: #f39c12;';
            return 'background: #fdf2f2; color: #e74c3c;';
        }

        function renderCalendar() {
            // Simplified calendar cell generation
            const grid = document.getElementById('calendar-days-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const hasBooking = mockBookings.some(b => b.date.endsWith(i.toString().padStart(2, '0')));
                const div = document.createElement('div');
                div.style.cssText = `background: white; min-height: 100px; padding: 0.8rem; border-bottom: 1px solid #eee; border-left: 1px solid #eee; position: relative; cursor: pointer;`;
                div.innerHTML = `
                <div style="font-size: 0.8rem; color: #bdc3c7;">${i}</div>
                ${hasBooking ? `<div style="margin-top: 0.5rem; background: var(--accent); height: 4px; border-radius: 2px;"></div>
                <div style="font-size: 0.65rem; color: var(--accent); font-weight: 700; margin-top: 0.3rem;">Reserved</div>` : ''}
            `;
                grid.appendChild(div);
            }
        }

        renderList();
    });
</script>
