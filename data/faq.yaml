questions:
  - question: "Where is Dandy Lane Cafe located in Hobart?"
    answer: "Dandy Lane Cafe is located at Unit 10 / 138 Collins Street, Hobart TAS 7000, tucked away in Collins Court."
  - question: "How can I find Dandy Lane in Collins Court?"
    answer: "To find us, head to Collins Court near Collins Street. We are located at Unit 10, directly opposite the JB HI-FI Hobart entrance in the laneway."
  - question: "Is Dandy Lane Cafe suitable for remote work?"
    answer: "Yes, we are a laptop-friendly cafe. We offer fast free WiFi and have quiet corners specifically suited for remote work and studying in Hobart CBD."
  - question: "What is your signature dish?"
    answer: "Our most famous signature dish is the Wine-Infused Benedict (available in six variations), featuring daily house-made hollandaise with a wine infusion. Other favorites include the Potato Parmesan Rosti and our Scotch Steak Sandwich."
  - question: "Do you offer wine-infused hollandaise every day?"
    answer: "Yes, our chef prepares fresh hollandaise every morning, and our signature wine-infused version is available daily as part of our Benedict range."
  - question: "What are your opening hours?"
    answer: "Dandy Lane is open Monday to Friday from 07:00 to 15:00, and Saturdays and Sundays from 09:00 to 14:00."
  - question: "Do you accommodate dietary requirements like gluten-free or vegan?"
    answer: "Absolutely. We offer various gluten-free and vegetarian options. Please inform our staff of any specific dietary needs or allergies when ordering."
  - question: "Can I make a booking for a large group?"
    answer: "While we mostly operate on a walk-in basis, we do accept bookings for groups of 6 or more. Please call us at 0498 061 067 to reserve a table."
  - question: "Do you offer takeaway options?"
    answer: "Yes, we offer a full takeaway menu for both specialty coffee and food. You can order at the counter for quick service."
  - question: "Is Dandy Lane Cafe pet friendly?"
    answer: "Yes, we have outdoor seating areas in Collins Court where well-behaved pets are more than welcome to join you."
  - question: "What is the price range at Dandy Lane?"
    answer: "Dandy Lane is a mid-range cafe ($$). Most brunch items range between $16 and $25 AUD, offering high-quality local produce at competitive prices."
  - question: "Is your coffee locally sourced?"
    answer: "Yes, we take pride in serving high-quality specialty coffee, often partnering with local Tasmanian roasters to ensure a fresh, local brew."
