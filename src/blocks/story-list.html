<section class="story-list" style="padding: 6rem 0; background: #fff;">
    <div class="container">
        <h2 style="font-size: 2.5rem; margin-bottom: 3rem;">Latest from the Lane</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 3rem;">
            {% for item in stories.stories %}
            <article class="story-card"
                style="border: 1px solid #eee; border-radius: 8px; overflow: hidden; transition: transform 0.3s ease;">
                <div style="height: 240px; background: #ddd; overflow: hidden;">
                    <img src="{{ item.cover }}" alt="{{ item.title }}"
                        style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="padding: 2rem;">
                    <div
                        style="font-size: 0.8rem; color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase;">
                        {{ item.date }} | {{ item.author }}
                    </div>
                    <h3 style="margin-top: 0; font-size: 1.5rem;">{{ item.title }}</h3>
                    <p style="color: var(--secondary); font-size: 1rem; margin-bottom: 1.5rem;">{{ item.summary }}</p>
                    <a href="stories-{{ item.slug }}.html"
                        style="font-weight: 700; color: var(--primary); text-decoration: none; border-bottom: 2px solid var(--accent);">Read
                        Full Story &rarr;</a>
                </div>
            </article>
            {% endfor %}
        </div>
    </div>
</section>
