<!-- Admin Dashboard Block -->
<section class="admin-dashboard" style="padding: 4rem 0; min-height: 80vh; background: #f4f6f8;">
    <div class="container">
        <div class="admin-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <div>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">{{ site.admin.dashboard_title }}</h1>
                <p style="color: var(--secondary);">Manage your lane sanctuary's reservations and capacity limits.</p>
            </div>
            <div class="view-toggles"
                style="display: flex; gap: 0.5rem; background: white; padding: 0.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <button id="view-list-btn" class="active btn-small"
                    style="padding: 0.5rem 1rem; cursor: pointer; border: none; background: var(--accent); color: white; border-radius: 4px;">List
                    View</button>
                <button id="view-cal-btn" class="btn-small"
                    style="padding: 0.5rem 1rem; cursor: pointer; border: none; background: transparent; color: var(--primary); border-radius: 4px;">Calendar
                    View</button>
            </div>
        </div>

        <!-- Dashboard Content Container -->
        <div id="dashboard-content"
            style="background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); padding: 2rem; overflow: hidden; border: 1px solid #eee;">
            <!-- List View -->
            <div id="list-view">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead style="background: #f8f9fa;">
                        <tr>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Status</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Guest</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Date/Time</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Size</th>
                            <th style="padding: 1.2rem; font-size: 0.8rem; text-transform: uppercase; color: #7f8c8d;">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-list-body">
                        <!-- Dynamic Loading -->
                    </tbody>
                </table>
            </div>

            <!-- Calendar View -->
            <div id="calendar-view" style="display: none;">
                <div class="calendar-controls"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <button id="prev-month"
                        style="background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">&larr;
                        Prev</button>
                    <h2 id="current-month-display"
                        style="margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.1em;">
                        Loading...</h2>
                    <button id="next-month"
                        style="background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">Next
                        &rarr;</button>
                </div>
                <div
                    style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #eee; border: 1px solid #eee; border-radius: 8px; overflow: hidden;">
                    <!-- Calendar Grid Header -->
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        MON</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        TUE</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        WED</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        THU</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        FRI</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        SAT</div>
                    <div
                        style="background: #f8f9fa; padding: 1rem; text-align: center; font-weight: 700; font-size: 0.7rem; color: #7f8c8d;">
                        SUN</div>

                    <!-- Days -->
                    <div id="calendar-days-grid" style="display: contents;"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', async function () {
        const dashboardContent = document.getElementById('dashboard-content');
        const loginOverlay = document.createElement('div');
        loginOverlay.id = 'admin-login';
        loginOverlay.innerHTML = `
            <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary); z-index: 2000; display: flex; align-items: center; justify-content: center; color: white; padding: 2rem; box-sizing: border-box;">
                <div style="max-width: 400px; width: 100%; text-align: center;">
                    <h2 style="margin-bottom: 2rem;">Admin Sanctuary Access</h2>
                    <input type="password" id="admin-pass" placeholder="Enter Master Key" style="width: 100%; padding: 1rem; border-radius: 4px; border: none; margin-bottom: 1rem; font-size: 1rem; text-align: center;">
                    <button id="login-btn" class="btn" style="width: 100%; border: none; cursor: pointer;">Unlock Dashboard</button>
                    <p id="login-error" style="color: var(--accent); margin-top: 1rem; font-size: 0.8rem; display: none;">Invalid Key. Access Denied.</p>
                </div>
            </div>
        `;
        document.body.appendChild(loginOverlay);

        const passInput = document.getElementById('admin-pass');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('login-error');

        let adminKey = localStorage.getItem('dandy_admin_key');
        if (adminKey) {
            checkAccess(adminKey);
        }

        loginBtn.addEventListener('click', () => checkAccess(passInput.value));
        passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(passInput.value); });

        async function checkAccess(key) {
            try {
                const res = await fetch('/api/admin/bookings', {
                    headers: { 'Authorization': `Bearer ${key}` }
                });
                if (res.ok) {
                    localStorage.setItem('dandy_admin_key', key);
                    adminKey = key;
                    loginOverlay.style.display = 'none';
                    loadBookings();
                } else {
                    throw new Error();
                }
            } catch (e) {
                errorMsg.style.display = 'block';
                localStorage.removeItem('dandy_admin_key');
            }
        }

        let bookings = [];

        async function loadBookings() {
            try {
                const res = await fetch('/api/admin/bookings', {
                    headers: { 'Authorization': `Bearer ${adminKey}` }
                });
                const data = await res.json();
                bookings = data.bookings || [];
                renderList();
            } catch (e) {
                console.error("Load Failed:", e);
            }
        }

        async function updateStatus(id, action) {
            if (!confirm(`Confirm ${action} for this reservation?`)) return;
            try {
                const res = await fetch('/api/admin/bookings', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminKey}`
                    },
                    body: JSON.stringify({ id, action })
                });
                if (res.ok) loadBookings();
            } catch (e) {
                alert("Operation failed");
            }
        }

        // --- View Logic ---
        const listView = document.getElementById('list-view');
        const calView = document.getElementById('calendar-view');
        const listBtn = document.getElementById('view-list-btn');
        const calBtn = document.getElementById('view-cal-btn');
        const prevBtn = document.getElementById('prev-month');
        const nextBtn = document.getElementById('next-month');
        const monthDisplay = document.getElementById('current-month-display');

        let calendarDate = new Date();

        listBtn.addEventListener('click', () => {
            listView.style.display = 'block';
            calView.style.display = 'none';
            listBtn.style.background = 'var(--accent)';
            listBtn.style.color = 'white';
            calBtn.style.background = 'transparent';
            calBtn.style.color = 'var(--primary)';
        });

        calBtn.addEventListener('click', () => {
            listView.style.display = 'none';
            calView.style.display = 'block';
            calBtn.style.background = 'var(--accent)';
            calBtn.style.color = 'white';
            listBtn.style.background = 'transparent';
            listBtn.style.color = 'var(--primary)';
            renderCalendar();
        });

        prevBtn.addEventListener('click', () => {
            calendarDate.setMonth(calendarDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            calendarDate.setMonth(calendarDate.getMonth() + 1);
            renderCalendar();
        });

        function renderList() {
            const body = document.getElementById('bookings-list-body');
            if (bookings.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="padding: 3rem; text-align: center; color: var(--secondary);">No active reservations found. All clear!</td></tr>';
                return;
            }
            body.innerHTML = bookings.map(b => `
            <tr style="border-bottom: 1px solid #f0f0f0;">
                <td style="padding: 1.2rem;">
                    <span style="padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; ${getStatusStyle(b.status)}">
                        ${(b.status || 'Pending').replace('_', ' ')}
                    </span>
                </td>
                <td style="padding: 1.2rem;">
                    <strong>${b.name}</strong><br>
                    <span style="font-size: 0.8rem; color: #7f8c8d;">${b.contact || 'No Contact'}</span>
                </td>
                <td style="padding: 1.2rem;">
                    ${b.date}<br>
                    <span style="font-size: 0.8rem; font-weight: 600;">${b.time}</span>
                </td>
                <td style="padding: 1.2rem;">${b.group_size || '?'} People</td>
                <td style="padding: 1.2rem;">
                    <button onclick="updateStatus('${b.id}', 'archive')" style="background: #34495e; color: white; border: none; padding: 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer;">Archive</button>
                    ${(b.status || '').includes('Review') ? `<button onclick="updateStatus('${b.id}', 'approve')" style="background: #27ae60; color: white; border: none; padding: 0.5rem; border-radius: 4px; font-size: 0.7rem; cursor: pointer; margin-left: 0.2rem;">Approve</button>` : ''}
                </td>
            </tr>
        `).join('');

            // Expose updateStatus to window for onclick
            window.updateStatus = updateStatus;
        }

        function getStatusStyle(status) {
            if (status === 'Confirmed') return 'background: #e6f7ee; color: #27ae60;';
            if (status?.includes('Review')) return 'background: #fff8e1; color: #f39c12;';
            return 'background: #fdf2f2; color: #e74c3c;';
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-days-grid');
            grid.innerHTML = '';

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            // Display Month Year
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthDisplay.innerText = `${monthNames[month]} ${year}`;

            // Get first day of month and total days
            const firstDay = new Date(year, month, 1).getDay(); // 0 is Sunday, 1 is Monday
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Adjust first day to start from Monday (0: Mon, 6: Sun)
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            // Empty cells for offset
            for (let i = 0; i < startOffset; i++) {
                const empty = document.createElement('div');
                empty.style.cssText = `background: #fdfdfd; min-height: 120px; border-bottom: 1px solid #eee; border-left: 1px solid #eee;`;
                grid.appendChild(empty);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayStr = i.toString().padStart(2, '0');
                const monthStr = (month + 1).toString().padStart(2, '0');
                const isoDate = `${year}-${monthStr}-${dayStr}`;

                const dayBookings = bookings.filter(b => b.date === isoDate);
                const totalPax = dayBookings.reduce((sum, b) => sum + parseInt(b.group_size || 0), 0);

                const div = document.createElement('div');
                div.style.cssText = `background: white; min-height: 120px; padding: 1rem; border-bottom: 1px solid #eee; border-left: 1px solid #eee; position: relative; transition: background 0.2s;`;
                div.onmouseover = () => div.style.background = '#fcfcfc';
                div.onmouseout = () => div.style.background = 'white';

                div.innerHTML = `
                <div style="font-size: 0.9rem; font-weight: 700; color: #bdc3c7; margin-bottom: 0.5rem;">${i}</div>
                ${dayBookings.length > 0 ? `
                    <div style="background: var(--accent); color: white; padding: 0.4rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; box-shadow: 0 2px 5px rgba(214, 48, 49, 0.2);">
                        ${dayBookings.length} RES / ${totalPax} PAX
                    </div>
                ` : ''}
                ${totalPax >= 16 ? `<div style="font-size: 0.6rem; color: var(--accent); font-weight: 800; margin-top: 0.3rem;">⚠️ AT CAPACITY</div>` : ''}
            `;
                grid.appendChild(div);
            }
        }
    });
</script>
