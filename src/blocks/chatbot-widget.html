<!-- Chatbot Widget Block -->
<style>
    .chatbot-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
        font-family: inherit;
    }

    #chat-toggle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
    }

    #chat-toggle:hover {
        transform: scale(1.05);
    }

    #chat-window {
        display: none;
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 380px;
        height: 600px;
        max-height: calc(100vh - 120px);
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(0, 0, 0, 0.05);
        overflow: hidden;
        flex-direction: column;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chat-header {
        background: var(--primary);
        padding: 1.2rem;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.2rem;
        background: #fdfdfd;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        scrollbar-width: thin;
    }

    .chat-footer {
        padding: 1rem;
        border-top: 1px solid #eee;
        display: flex;
        gap: 0.5rem;
        background: white;
    }

    #chat-input {
        flex: 1;
        border: 1px solid #ddd;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
    }

    #chat-input:focus {
        border-color: var(--accent);
    }

    .message {
        padding: 0.8rem 1rem;
        border-radius: 12px;
        max-width: 85%;
        font-size: 14px;
        line-height: 1.5;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .message.user {
        background: var(--accent);
        color: white;
        border-bottom-right-radius: 4px;
        align-self: flex-end;
    }

    .message.bot {
        background: white;
        color: #333;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        border: 1px solid #f0f0f0;
    }

    /* Mobile Adaptations */
    @media (max-width: 600px) {
        #chat-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            width: auto;
            height: calc(100% - 100px);
            max-height: 550px;
            border-radius: 20px;
            z-index: 1001;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .chat-open-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
        }
    }
</style>

<div class="chat-open-overlay" id="chat-overlay"></div>

<div id="dandy-chatbot" class="chatbot-container">
    <button id="chat-toggle" aria-label="Open Chat Concierge">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>

    <div id="chat-window">
        <div class="chat-header">
            <div>
                <strong style="display: block; font-size: 0.9rem;">Dandy Lane Concierge</strong>
                <span style="font-size: 0.7rem; opacity: 0.8;">Online • Always Crafting</span>
            </div>
            <button id="close-chat" aria-label="Close Chat"
                style="background: transparent; border: none; color: white; cursor: pointer; font-size: 1.5rem; padding: 0.5rem;">&times;</button>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="message bot">
                {{ site.chatbot.welcome_message }}
            </div>
        </div>

        <form id="chat-form" class="chat-footer">
            <input type="text" id="chat-input" placeholder="Ask about coffee or booking..." aria-label="Chat Message"
                autocomplete="off">
            <button type="submit" aria-label="Send Message"
                style="background: var(--accent); color: white; border: none; padding: 0.7rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('chat-toggle');
        const windowEl = document.getElementById('chat-window');
        const close = document.getElementById('close-chat');
        const overlay = document.getElementById('chat-overlay');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        const messages = document.getElementById('chat-messages');

        toggle.addEventListener('click', () => {
            const isHidden = windowEl.style.display === 'none' || windowEl.style.display === '';
            windowEl.style.display = isHidden ? 'flex' : 'none';
            if (isHidden) {
                input.focus();
                if (window.innerWidth <= 600) {
                    toggle.style.display = 'none';
                    overlay.style.display = 'block';
                }
            }
        });

        const closeFunc = () => {
            windowEl.style.display = 'none';
            toggle.style.display = 'flex';
            overlay.style.display = 'none';
        };

        close.addEventListener('click', (e) => {
            e.stopPropagation();
            closeFunc();
        });

        overlay.addEventListener('click', closeFunc);

        let chatHistory = [];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            let webUserId = localStorage.getItem('dandy_chat_uid');
            if (!webUserId) {
                webUserId = 'web_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('dandy_chat_uid', webUserId);
            }

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot loading';
            loadingDiv.style.opacity = '0.6';
            loadingDiv.textContent = '...';
            messages.appendChild(loadingDiv);
            messages.scrollTop = messages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory,
                        sender_id: webUserId
                    })
                });
                const data = await response.json();

                if (messages.contains(loadingDiv)) messages.removeChild(loadingDiv);

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                    chatHistory.push({ role: 'user', parts: [{ text: text }] });
                    chatHistory.push({ role: 'model', parts: [{ text: data.reply }] });
                    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
                } else {
                    throw new Error('No reply');
                }
            } catch (error) {
                if (messages.contains(loadingDiv)) messages.removeChild(loadingDiv);
                appendMessage("I'm sorry, I'm having trouble connecting to the lane right now. Cheers for your patience.", 'bot');
            }
        });

        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
    });
</script>
