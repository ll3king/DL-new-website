<section class="faq-list" style="padding: 4rem 0; background: #fff;">
    <div class="container">
        <h2 style="margin-bottom: 2rem;">Common Questions</h2>
        {% if faq.intro %}
        <p style="max-width: 720px; margin: 0 0 2rem; color: var(--secondary); font-size: 1.05rem;">{{ faq.intro }}</p>
        {% endif %}
        <div class="faq-container">
            {% for item in faq.questions %}
            <div class="faq-item" style="margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem;">
                <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--primary);">{{ item.question }}</h3>
                <p style="color: var(--secondary);">{{ item.answer }}</p>
                {% if item.links %}
                <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.75rem;">
                    {% for link in item.links %}
                    <a href="{{ link.href }}" style="font-weight: 700; color: var(--primary); text-decoration: none; border-bottom: 2px solid var(--accent);">{{ link.label }}</a>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>
</section>
