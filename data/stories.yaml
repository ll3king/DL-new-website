  - slug: "hand-whisked-heritage"
    title: "Hand-Whisked Heritage"
    date: "2026-02-22"
    author: "Kitchen Lead"
    summary: "A deep dive into the physical craft and labour behind our daily hollandaise ritual."
    answer_summary: "This story supports Dandy Lane's hollandaise craft. The hand-whisking ritual is part of the cafe's brunch identity and connects to Wine-Infused Benedict and Potato Parmesan Rosti."
    evidence_points:
      - "Hand-whisked daily"
      - "Copper whisk rhythm"
      - "Regional wine reductions"
      - "Core culinary identity"
    related_menu_item: "Wine-Infused Benedict and Potato Parmesan Rosti"
    related_links:
      - label: "View the menu"
        href: "/menu"
      - label: "Read the hollandaise story"
        href: "/stories-the-art-of-the-wine-infused-hollandaise"
    content: "There is no machine in the world that can replicate the texture of a hand-whisked hollandaise. Every morning at 6:30 AM, our kitchen echoes with the rhythm of copper whisks hitting stainless steel. This heritage technique allows us to monitor the precise emulsification of local butter and regional wine reductions. It is a labour-intensive ritual, but it is the cornerstone of our culinary identity. When you see that perfectly silken sauce on your rosti, you're tasting hours of physical craft."
    featured: true
    cover: "assets/media/dish_rosti.jpg"
    tags: ["Culinary", "Traditional Techniques"]

