<section class="location-nap" style="padding: 5rem 0; background: var(--bg);">
    <div class="container">
        <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4rem; align-items: flex-start;">
            <div class="info">
                <h2 style="margin-top: 0; font-weight: 900; font-size: 2.5rem; text-transform: uppercase;">{{
                    page_context.title or 'Find Us' }}</h2>
                <p style="font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 600;">
                    <span>{{ site.contact.nap.address }}</span>
                </p>
                <p style="color: #b71c1c; font-weight: 700; margin-bottom: 2rem; line-height: 1.4;">
                    {{ site.contact.nap.directions }}
                </p>

                <div style="margin: 2.5rem 0; border-top: 2px solid #f0f0f0; padding-top: 2rem;">
                    <p style="margin-bottom: 0.8rem;">
                        <strong
                            style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; color: #666; display: block; margin-bottom: 0.3rem;">Call
                            Us</strong>
                        <a href="tel:{{ site.contact.nap.phone }}"
                            style="color: var(--primary); text-decoration: none; font-size: 1.1rem; font-weight: 700;">{{
                            site.contact.nap.phone }}</a>
                    </p>
                    <p>
                        <strong
                            style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.1em; color: #666; display: block; margin-bottom: 0.3rem;">Email
                            Us</strong>
                        <a href="mailto:{{ site.contact.nap.email }}"
                            style="color: var(--primary); text-decoration: none; font-size: 1.1rem; font-weight: 700;">{{
                            site.contact.nap.email }}</a>
                    </p>
                </div>

                <div class="social-links" style="margin-top: 2rem; display: flex; gap: 1.5rem;">
                    <a href="{{ site.social.instagram }}"
                        style="color: #b71c1c; font-weight: 800; text-decoration: none; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; border-bottom: 2px solid transparent; transition: border-color 0.3s;">Instagram</a>
                    <a href="{{ site.social.facebook }}"
                        style="color: #b71c1c; font-weight: 800; text-decoration: none; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; border-bottom: 2px solid transparent; transition: border-color 0.3s;">Facebook</a>
                </div>
            </div>

            <div class="map-container"
                style="position: relative; height: 450px; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.1); background: #eee; border: 1px solid #eee;">
                <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
                    src="https://maps.google.com/maps?q=Dandy%20Lane%20Cafe%20Hobart&t=&z=16&ie=UTF8&iwloc=&output=embed"
                    style="filter: grayscale(0.2) contrast(1.1); pointer-events: auto;">
                </iframe>
                <div style="position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; gap: 8px;">
                    <a href="{{ site.same_as[0] }}" target="_blank"
                        style="flex: 1; text-align: center; background: white; color: #b71c1c; padding: 0.8rem; border-radius: 2px; text-decoration: none; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                        Open in Google Maps
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
