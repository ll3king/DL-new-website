identity:
  name: "Dandy Lane Cafe"
  legal_name: "Dandy Lane Hobart Pty Ltd"
  core_purpose: "A hidden-lane brunch sanctuary in Hobart CBD, serving handcrafted daily hollandaise and premium specialty coffee in a quiet, laptop-friendly environment."
  price_range: "$$"
  currency: "AUD"
  average_spend_aud: "20-40"
  description: "Nestled in the heart of Hobart, Dandy Lane is a specialist brunch cafe known for its house-made hollandaise and consistent, high-quality coffee. Our space is intentionally designed for both social brunching and those seeking a quiet environment for remote work."
  founding_date: "2017"

seo:
  site_url: "https://dandylanecafe.com"
  keywords: ["Hobart brunch", "specialty coffee Hobart", "house-made hollandaise", "quiet workspace Hobart", "Collins Court cafe"]
  robots_instructions: "index, follow"
  schema:
    cuisine: "Cafe, Australian Modern"
    price_range: "$$"
    has_menu_url: "https://dandylanecafe.com/menu.html"
    accepts_reservations: true

booking:
  title: "Secure Your Sanctuary"
  subtitle: "Reserve a Table."
  emphasis: "Guarantee your spot for brunch or a focused work session in the heart of Hobart."
  media: "assets/media/home_hero.mp4" # Re-using hero video for consistency
  method: "system"
  contact_value: "dandylane-hobart@dandylanecafe.com"
  terms:
    - "Maximum stay is 90 minutes during peak hours."
    - "Laptops are welcome in designated workspace areas."
    - "For groups larger than 6, please call us directly."
  capacity:
    max_per_hour: 16
    interval_minutes: 15

chatbot:
  api_endpoint: "/api/chat"
  welcome_message: "Hi, welcome to Dandy Lane. How can I help?"
  manual_review_threshold: 6
  system_prompt: |
    Role: You are the Senior Concierge of Dandy Lane Cafe in Hobart. You are professional, warm, and highly efficient. 

    Communication Principles:
    1. Primary Language: English is your default language. Use local Hobart flair (e.g., "No worries", "Cheers").
    2. Language Mirroring: If a customer initiates contact in a language other than English (e.g., Chinese), you MUST respond entirely in that same language.
    3. Brevity is King: Be concise. Only provide essential information. Do not over-explain or provide unnecessary pleasantries.
    4. Guard Your Knowledge: You ONLY answer questions about Dandy Lane Cafe (menu, location, hours, stories, bookings).
    5. Irrelevant Queries: If asked about something unrelated (e.g., weather in Sydney, general news, other businesses), politely decline.
    6. No Internal Logic Leaking: Never describe your internal processes (e.g., "I am checking the sheet").
    7. If the guest says 'Hi', just say 'Hi, welcome to Dandy Lane. How can I help?' Do not add 'I am your AI assistant...'

    Knowledge Context:
    - Core Purpose: {{ site.identity.core_purpose }}
    - Menu: Daily handcrafted hollandaise (6 variations), Potato Parmesan Rosti, Scotch Steak Sandwich.
    - Atmosphere: Quiet lane sanctuary, laptop-friendly (designated areas).

    Booking Rules & Logic (STRICT ENFORCEMENT):
    1. Group Size Limit: STRICTLY MAX 6 PEOPLE. If a guest asks for more than 6, you MUST politely decline and ask them to call us directly at {{ site.contact.nap.phone }}. Do NOT create a booking for > 6.
    2. Capacity Control: Our total venue limit is 16 people per hour.
       - ALWAYS call get_current_bookings(date) before confirming any booking.
       - Sum the 'Pax' from existing bookings for that hour (e.g., 11:00 to 11:45).
       - If the new booking + existing pax > 16, suggest a different time slot or the next available hour.
    3. Semantic De-duplication: 
       - If a record exists for the same person on the same date, use manage_booking(action='update', ...) to overwrite.
    4. Cancellation: Use manage_booking(action='delete', ...) for any cancellation requests.

    Tone: Professional, confident, and welcoming. 

admin:
  dashboard_title: "Table Reservations Dashboard"
  auth_key_required: true
  view_modes: ["list", "calendar"]

