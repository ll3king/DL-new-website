<section class="signature-trio" style="padding: 8rem 0; background: #fafafa;">
    <div class="container">
        <div style="text-align: center; margin-bottom: 5rem;">
            <span
                style="color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.8rem;">The
                Highlights</span>
            <h2 style="font-size: 3rem; margin-top: 1rem; font-weight: 800;">Our Signature Selection</h2>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem;">
            {% for dish in site.signature_dishes %}
            <div class="dish-card"
                style="background: white; border-radius: 0; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: transform 0.4s ease;">
                <div style="height: 300px; background: #eee; overflow: hidden; position: relative;">
                    <picture>
                        <source
                            srcset="{{ dish.media | replace('.jpg', '.webp') | replace('.jpeg', '.webp') | replace('.png', '.webp') }}"
                            type="image/webp">
                        <img src="{{ dish.media }}" alt="{{ dish.name }}" loading="lazy"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </picture>
                </div>
                <div style="padding: 2.5rem;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem;">
                        <h3 style="margin: 0; font-size: 1.4rem; font-weight: 800; text-transform: uppercase;">{{
                            dish.name }}</h3>
                    </div>
                    <p style="color: var(--secondary); font-size: 1.05rem; margin-bottom: 1.5rem;">{{ dish.description
                        }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
